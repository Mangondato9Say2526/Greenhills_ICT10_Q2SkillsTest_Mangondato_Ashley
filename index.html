<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
     <div class="container">

        <header>
            <h1>Non-Metal Elements</h1>
            <p>Periodic Table Information Finder</p>
        </header>

        <main>

            <div class="instructions">
                <strong>Instructions:</strong>
                <p>
                    Enter the symbol of a non-metal element.
                    (Example: H, C, O, N, Xe)
                </p>
            </div>

            <label for="symbol">Element Symbol</label>

            <input
                type="text"
                id="symbol"
                placeholder="Enter element symbol"
            >

            <button py-click="search_element">
                Check Details
            </button>

            <div id="result">
                <p>Search for an element to see its information.</p>
            </div>

        </main>

        <footer>
            <p>Skills Test • 2nd Quarter • ICT</p>
        </footer>

    </div>
    <py-script src="main.py"></py-script>
</body>
</html>
